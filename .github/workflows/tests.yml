name: HF Bridge source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r app/requirements.txt pytest httpx
      - name: Install ffprobe for real media validation
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Lint syntax
        run: python -m compileall -q app
      - name: Run offline tests (no GPU inference)
        run: python -m pytest -q tests
